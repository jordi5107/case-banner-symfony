server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass   app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include        fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;

        # Evita que Nginx sirva otros .php
        internal;
    }

    # Devuelve 404 para los demás .php
    location ~ \.php$ {
        return 404;
    }

    # En dev, los assets de EasyAdmin/AssetMapper los sirve Symfony dinámicamente.
    # try_files intenta el fichero en disco y, si no existe, lo pasa a index.php.
    location ~* \.(css|js|ico|png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot)$ {
        try_files $uri /index.php$is_args$args;
        expires off;
        access_log off;
    }
}

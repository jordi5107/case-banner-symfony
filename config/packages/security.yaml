security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        # Proveedor en memoria para el panel de administración.
        # En producción, sustituir por un proveedor de base de datos.
        admin_users:
            memory:
                users:
                    # Usuario de demo. Cambiar la contraseña antes de desplegar en producción:
                    #   docker exec banner-case-m-app-1 php bin/console security:hash-password
                    # y sustituir el valor '{noop}admin' por el hash generado.
                    admin:
                        password: '$2y$10$8BxTgqrlm56mdrL0C8aT/eXUv.1GJg35uIKHCQbnkUWGpXuivpljS'
                        roles: ['ROLE_ADMIN']

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build|bundles)/
            security: false

        # Panel de administración protegido con HTTP Basic Auth.
        # Compatible con integración via iframe desde PrestaShop: el navegador
        # cachea las credenciales tras el primer login y las reutiliza en el iframe.
        admin:
            pattern: ^/(admin|login|logout)
            provider: admin_users
            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: /admin
                enable_csrf: true
            logout:
                path: app_logout
                target: app_login

        # Rutas públicas: API JSON y frontend HTML consumidos por PrestaShop.
        main:
            pattern: ^/
            security: false

    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
